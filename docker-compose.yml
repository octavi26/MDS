services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: craftgame
      POSTGRES_USER: craftgame
      POSTGRES_PASSWORD: craftgame
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U craftgame -d craftgame"]
      interval: 5s
      timeout: 5s
      retries: 10

  ai-service:
    build:
      context: ./src/ai-service
    environment:
      OLLAMA_BASE_URL: http://host.docker.internal:11434
    ports:
      - "8001:8001"
    volumes:
      - ai-media:/app/media

  backend:
    build:
      context: .
      dockerfile: src/backend/CraftGame.Api/Dockerfile
    environment:
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__DefaultConnection: Host=db;Port=5432;Database=craftgame;Username=craftgame;Password=craftgame
      # Use a local Ollama LLM for context-aware companion lines. Reaches the
      # host's Ollama (port 11434). Falls back to deterministic lines if it's
      # unreachable, so teammates without Ollama still get a working game.
      CompanionAgent__Enabled: "true"
      CompanionAgent__Provider: "ollama"
      CompanionAgent__OllamaBaseUrl: "http://host.docker.internal:11434"
      CompanionAgent__OllamaModel: "qwen2.5:3b-instruct"
      CompanionAgent__TimeoutSeconds: "30"
    extra_hosts:
      # Lets Linux hosts resolve host.docker.internal (automatic on Mac/Windows).
      - "host.docker.internal:host-gateway"
    ports:
      - "5088:8080"
    depends_on:
      db:
        condition: service_healthy
      ai-service:
        condition: service_started

  frontend:
    build:
      context: .
      dockerfile: src/frontend/Dockerfile
    environment:
      VITE_API_BASE_URL: http://localhost:5088
    ports:
      - "5173:5173"
    depends_on:
      - backend

volumes:
  postgres-data:
  ai-media:
