services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: craftgame
      POSTGRES_USER: craftgame
      POSTGRES_PASSWORD: craftgame
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    deploy:
      resources:
        limits:
          memory: 2G
        reservations:
          memory: 1G
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U craftgame -d craftgame"]
      interval: 5s
      timeout: 5s
      retries: 10

  ai-service:
    build:
      context: ./src/ai-service
    environment:
      OLLAMA_BASE_URL: http://ollama:11434
      # Crafting uses its OWN small, fast model -- separate from the companion's
      # 3B -- so that (a) novel combinations come back in well under a second
      # ("lightning fast"), and (b) a craft never has to queue behind a companion
      # line on the same model. Sharing the 3B caused crafts to time out into the
      # backend's "Combination failed" error under contention. This model must be
      # one the ollama service actually pulls (see its entrypoint).
      OLLAMA_MODEL: qwen2.5:0.5b-instruct
      # Safety net only -- the 0.5B model normally answers in <1s. If it's somehow
      # slow, fall back fast rather than make the player wait.
      CRAFT_AI_TIMEOUT_SECONDS: "8"
    ports:
      - "8001:8001"
    volumes:
      - ai-media:/app/media
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 4G
        reservations:
          memory: 2G
    depends_on:
      ollama:
        condition: service_started

  # Local LLM for the companion's context-aware lines. Runs fully in Docker and
  # auto-downloads the model on first run (cached in the ollama-data volume), so
  # the whole stack is zero-setup and identical on macOS, Windows and Linux.
  ollama:
    image: ollama/ollama:latest
    environment:
      # Keep the model resident in memory indefinitely (-1). A cold CPU load of
      # the model can take longer than the backend's request timeout, which makes
      # the companion silently fall back to canned lines ("same phrase over and
      # over"). Staying warm means requests never pay that cold-start penalty.
      OLLAMA_KEEP_ALIVE: "-1"
    volumes:
      - ollama-data:/root/.ollama
    deploy:
      resources:
        limits:
          cpus: '4.0'
          memory: 8G
        reservations:
          memory: 4G
    entrypoint:
      - /bin/sh
      - -c
      - |
        ollama serve &
        until ollama list >/dev/null 2>&1; do sleep 1; done
        # 3B: the companion's personality model. 0.5B: the crafting model (fast).
        ollama pull qwen2.5:3b-instruct || true
        ollama pull qwen2.5:0.5b-instruct || true
        # Warm both (load weights into RAM) so the first real companion line and
        # the first craft are fast instead of timing out on a cold start.
        ollama run qwen2.5:3b-instruct "hi" >/dev/null 2>&1 || true
        ollama run qwen2.5:0.5b-instruct "hi" >/dev/null 2>&1 || true
        wait
    healthcheck:
      test: ["CMD-SHELL", "ollama list | grep -q qwen2.5:3b-instruct && ollama list | grep -q qwen2.5:0.5b-instruct"]
      interval: 10s
      timeout: 5s
      retries: 60
      start_period: 20s

  backend:
    build:
      context: .
      dockerfile: src/backend/CraftGame.Api/Dockerfile
    environment:
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__DefaultConnection: Host=db;Port=5432;Database=craftgame;Username=craftgame;Password=craftgame
      # Context-aware companion lines come from the dockerized Ollama service.
      # Falls back to deterministic lines if it's unreachable, so the game always
      # works even while the model is still downloading.
      CompanionAgent__Enabled: "true"
      CompanionAgent__Provider: "ollama"
      CompanionAgent__OllamaBaseUrl: "http://ollama:11434"
      CompanionAgent__OllamaModel: "qwen2.5:3b-instruct"
      # Generous headroom for slower CPUs: even a warm 3B model can take 15-20s
      # on a modest machine, and a cold start much longer. Better to wait than to
      # fall back to a canned line.
      CompanionAgent__TimeoutSeconds: "60"
      # The backend must wait longer than the ai-service's own craft timeout
      # (8s), otherwise it gives up first and shows "Combination failed" even
      # though the ai-service would have returned a result.
      AiCraftClient__TimeoutSeconds: "15"
    ports:
      - "5088:8080"
    deploy:
      resources:
        limits:
          memory: 2G
        reservations:
          memory: 1G
    depends_on:
      db:
        condition: service_healthy
      ai-service:
        condition: service_started
      ollama:
        condition: service_healthy

  frontend:
    build:
      context: .
      dockerfile: src/frontend/Dockerfile
    environment:
      VITE_API_BASE_URL: http://localhost:5088
    ports:
      - "5173:5173"
    deploy:
      resources:
        limits:
          memory: 1G
        reservations:
          memory: 512M
    depends_on:
      - backend

volumes:
  postgres-data:
  ai-media:
  ollama-data:
