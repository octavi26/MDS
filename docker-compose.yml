services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: craftgame
      POSTGRES_USER: craftgame
      POSTGRES_PASSWORD: craftgame
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U craftgame -d craftgame"]
      interval: 5s
      timeout: 5s
      retries: 10

  ai-service:
    build:
      context: ./src/ai-service
    environment:
      OLLAMA_BASE_URL: http://ollama:11434
      # Reuse the companion's model for inventing new crafting combinations, so
      # the stack only has to download and keep ONE model resident in memory.
      # The code default (qwen2.5:0.5b-instruct) was never pulled by the ollama
      # service, so the AI crafting path 404'd and silently fell back to canned
      # results on every novel combination.
      OLLAMA_MODEL: qwen2.5:3b-instruct
      # Headroom so a warm 3B generation on a slower CPU doesn't time out into
      # the fallback (the default is only 5s).
      CRAFT_AI_TIMEOUT_SECONDS: "20"
    ports:
      - "8001:8001"
    volumes:
      - ai-media:/app/media
    depends_on:
      ollama:
        condition: service_started

  # Local LLM for the companion's context-aware lines. Runs fully in Docker and
  # auto-downloads the model on first run (cached in the ollama-data volume), so
  # the whole stack is zero-setup and identical on macOS, Windows and Linux.
  ollama:
    image: ollama/ollama:latest
    volumes:
      - ollama-data:/root/.ollama
    entrypoint:
      - /bin/sh
      - -c
      - |
        ollama serve &
        until ollama list >/dev/null 2>&1; do sleep 1; done
        ollama pull qwen2.5:3b-instruct || true
        wait
    healthcheck:
      test: ["CMD-SHELL", "ollama list | grep -q qwen2.5:3b-instruct"]
      interval: 10s
      timeout: 5s
      retries: 60
      start_period: 20s

  backend:
    build:
      context: .
      dockerfile: src/backend/CraftGame.Api/Dockerfile
    environment:
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__DefaultConnection: Host=db;Port=5432;Database=craftgame;Username=craftgame;Password=craftgame
      # Context-aware companion lines come from the dockerized Ollama service.
      # Falls back to deterministic lines if it's unreachable, so the game always
      # works even while the model is still downloading.
      CompanionAgent__Enabled: "true"
      CompanionAgent__Provider: "ollama"
      CompanionAgent__OllamaBaseUrl: "http://ollama:11434"
      CompanionAgent__OllamaModel: "qwen2.5:3b-instruct"
      CompanionAgent__TimeoutSeconds: "30"
    ports:
      - "5088:8080"
    depends_on:
      db:
        condition: service_healthy
      ai-service:
        condition: service_started
      ollama:
        condition: service_healthy

  frontend:
    build:
      context: .
      dockerfile: src/frontend/Dockerfile
    environment:
      VITE_API_BASE_URL: http://localhost:5088
    ports:
      - "5173:5173"
    depends_on:
      - backend

volumes:
  postgres-data:
  ai-media:
  ollama-data:
