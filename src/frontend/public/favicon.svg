<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f97316" /> <!-- Orange 500 -->
      <stop offset="100%" stop-color="#dc2626" /> <!-- Red 600 -->
    </linearGradient>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#18181b" /> <!-- Zinc 900 -->
      <stop offset="100%" stop-color="#09090b" /> <!-- Zinc 950 -->
    </linearGradient>
  </defs>
  
  <!-- Background with slight rounding -->
  <rect width="100" height="100" rx="24" fill="url(#bgGrad)" stroke="#27272a" stroke-width="2"/>
  
  <!-- Outer Matrix Hexagon -->
  <path d="M50 16 L82 34 L82 72 L50 90 L18 72 L18 34 Z" fill="none" stroke="#ea580c" stroke-width="4" stroke-linejoin="round" opacity="0.4"/>
  
  <!-- Inner Synthesis Core -->
  <path d="M50 28 L72 40 L72 66 L50 78 L28 66 L28 40 Z" fill="none" stroke="url(#glowGrad)" stroke-width="6" stroke-linejoin="round"/>
  
  <!-- Core Energy -->
  <path d="M50 42 L62 48 L62 58 L50 64 L38 58 L38 48 Z" fill="url(#glowGrad)"/>
  
  <!-- Center Spark -->
  <circle cx="50" cy="53" r="4" fill="#ffffff" opacity="0.9"/>
  
  <!-- Connecting Lines -->
  <line x1="50" y1="16" x2="50" y2="28" stroke="#ea580c" stroke-width="2" opacity="0.6"/>
  <line x1="50" y1="78" x2="50" y2="90" stroke="#ea580c" stroke-width="2" opacity="0.6"/>
  <line x1="18" y1="34" x2="28" y2="40" stroke="#ea580c" stroke-width="2" opacity="0.6"/>
  <line x1="82" y1="72" x2="72" y2="66" stroke="#ea580c" stroke-width="2" opacity="0.6"/>
  <line x1="82" y1="34" x2="72" y2="40" stroke="#ea580c" stroke-width="2" opacity="0.6"/>
  <line x1="18" y1="72" x2="28" y2="66" stroke="#ea580c" stroke-width="2" opacity="0.6"/>
</svg>