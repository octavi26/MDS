[project]
name = "craft-game-ai-service"
version = "0.1.0"
description = "FastAPI AI and TTS service for the MDS level crafting game"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.124.0",
  "uvicorn[standard]>=0.38.0",
  "pydantic>=2.12.0",
  "httpx>=0.28.0",
]

[project.optional-dependencies]
test = ["pytest>=9.0.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
