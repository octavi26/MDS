name: CI
on:
  pull_request:
  push:
    branches:
      - main
jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 9.0.x
      - run: dotnet restore MDS.sln
      - run: dotnet build MDS.sln --no-restore
      - run: dotnet test MDS.sln --no-build
