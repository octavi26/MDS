# NVIDIA GPU override for the Docker Ollama fallback mode.
#
# Hands the dockerized Ollama the host GPU so the companion's 3B model runs on
# CUDA instead of the CPU. Native Windows Ollama is still the recommended
# default; use this only when you explicitly choose container mode.
#
# Requires the NVIDIA Container Toolkit on the host:
#   https://docs.nvidia.com/datacenter/cloud-native/container-toolkit/latest/install-guide.html
#
# Run with:
#   docker compose -f docker-compose.yml -f docker-compose.container-ollama.yml -f docker-compose.gpu.yml up -d --build
services:
  ollama:
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
